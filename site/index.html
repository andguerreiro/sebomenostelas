<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sebo Menos Telas</title>
<meta name="description" content="Venda de livros usados a partir de 10 reais e coleta de doações de ficção e infantojuvenis em São Paulo, SP. Entregas grátis na Mooca.">
<meta name="robots" content="index,follow">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="canonical" href="https://sebomenostelas.com.br/">
<style>
*{box-sizing:border-box}
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:1rem/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;background:#fff}
main,footer{width:min(calc(100% - 32px),760px);margin-left:auto;margin-right:auto}
main{margin-top:auto;padding:24px 0}
h1{margin:0 0 20px;text-align:center;font-size:clamp(1.6rem,6vw,2.2rem);font-weight:700;letter-spacing:-.03em}
form{display:grid;grid-template-columns:1fr auto;gap:6px}
label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
input,button{min-height:44px;font:inherit}
input{width:100%;min-width:0;padding:0 12px;border:1px solid #999;border-radius:6px;background:#fff;color:#222}
input:focus{outline:0;border-color:#777}
button{border:1px solid #222;border-radius:6px;padding:0 16px;background:#222;color:#fff;font-weight:650;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #777;outline-offset:2px}
#resultados{margin-top:18px}
.status{margin:0 0 6px;color:#666;font-size:.9rem}
.livro{padding:10px 0;border-top:1px solid #ddd}
.livro h2{margin:0 0 2px;font-size:1rem;line-height:1.3}
.livro h2 a{color:inherit}
.livro p{margin:2px 0}
.autor{font-weight:600}
.preco{font-weight:700}
.foto{display:inline-block;margin-top:4px;font-size:.88rem;color:inherit}
.vazio{padding:10px 0;color:#666}
footer{margin-top:auto;padding:12px 0 16px;border-top:1px solid #ddd;text-align:center;color:#666;font-size:.85rem}
footer p{margin:0}
footer a{color:inherit}
@media(max-width:520px){
  form{grid-template-columns:1fr}
  button{width:100%}
}
@media(prefers-color-scheme:dark){
  body,input{background:#111;color:#eee}
  input{border-color:#666}
  button{background:#eee;color:#111;border-color:#eee}
  .status,.vazio,footer{color:#aaa}
  .livro,footer{border-color:#333}
}
</style>
</head>
<body>
<main>
<h1>Sebo Menos Telas</h1>
<form id="busca" role="search">
<label for="q">Buscar livro</label>
<input id="q" name="q" type="search" inputmode="search" autocomplete="off" autofocus placeholder="Digite um título, autor, editora...">
<button type="submit">Garimpar</button>
</form>
<section id="resultados" aria-live="polite"></section>
</main>

<footer>
<p>Desde 2017 · São Paulo, SP</p>
<p><a href="https://wa.me/5511981350566" target="_blank" rel="noopener noreferrer nofollow">Contato</a> · <a id="doacao" href="https://wa.me/5511981350566?text=Ol%C3%A1%21%20Quero%20doar%20livros%20para%20o%20Sebo%20Menos%20Telas.%0AGostaria%20de%20saber%20como%20funciona." target="_blank" rel="noopener noreferrer nofollow">Doação</a> · <a href="/sobre.html">Sobre</a></p>
</footer>

<script>
(() => {
  const P = "5511981350566";
  const f = document.getElementById("busca");
  const i = document.getElementById("q");
  const r = document.getElementById("resultados");

  const n = v => String(v ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLocaleLowerCase("pt-BR");

  const m = v => {
    const n = Number(v);
    return Number.isFinite(n)
      ? n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})
      : String(v ?? "");
  };

  const e = v => String(v ?? "").replace(
    /[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])
  );

  const w = b => `https://wa.me/${P}?text=${encodeURIComponent(
    `Olá! Gostaria de receber fotos detalhadas deste exemplar:\n\n${b.titulo}, ${b.autor} — ${m(b.preco)}`
  )}`;

  let c = null;

  async function buscar(q) {
    r.innerHTML = '<p class="status">Buscando...</p>';
    try {
      if (!c) {
        const x = await fetch("/dados/catalogo.json",{cache:"no-cache"});
        if (!x.ok) throw Error();
        c = await x.json();
      }

      const l = c.filter(b =>
        n([b.titulo,b.autor,b.editora,b.isbn,b.ano,b.estante,b.idioma,b.preco].join(" ")).includes(n(q))
      ).sort((a,b) =>
        n(a.titulo).localeCompare(n(b.titulo),"pt-BR")
      );

      if (!l.length) {
        r.innerHTML = '<p class="vazio">Nenhum livro encontrado.</p>';
        return;
      }

      r.innerHTML =
        `<p class="status">${l.length} livro${l.length == 1 ? "" : "s"} encontrado${l.length == 1 ? "" : "s"} para “${e(q)}”.</p>` +
        l.map(b => `
          <article class="livro">
            <h2><a href="/livro/${e(b.slug)}.html">${e(b.titulo)}</a></h2>
            <p class="autor">${e(b.autor)}</p>
            <p>${e(b.editora)} · ${e(b.ano)} · ${e(b.estante)}</p>
            <p class="preco">${e(m(b.preco))}</p>
            <a class="foto" href="${e(w(b))}" target="_blank" rel="noopener noreferrer nofollow">Pedir fotos detalhadas pelo WhatsApp</a>
          </article>
        `).join("");
    } catch {
      r.innerHTML = '<p class="vazio">Não foi possível carregar o catálogo. Tente novamente.</p>';
    }
  }

  f.addEventListener("submit", x => {
    x.preventDefault();
    const q = i.value.trim();
    if (!q) {
      r.innerHTML = "";
      i.focus();
      return;
    }
    history.replaceState(null,"",`?q=${encodeURIComponent(q)}`);
    buscar(q);
  });

  const q = new URLSearchParams(location.search).get("q");
  if (q) {
    i.value = q;
    buscar(q);
  }
})();
</script>
</body>
</html>
