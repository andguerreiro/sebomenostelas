<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;background:#fff;line-height:1.45}main{width:min(100% - 32px,760px);margin:auto;padding:48px 0 32px}h1{margin:0 0 28px;text-align:center;font-size:clamp(1.7rem,7vw,2.4rem);font-weight:700;letter-spacing:-.03em}form{display:grid;grid-template-columns:1fr auto;gap:8px}input{width:100%;min-width:0;min-height:48px;padding:0 14px;border:1px solid #999;border-radius:6px;background:#fff;color:#222;font:inherit}button{min-height:48px;border:1px solid #222;border-radius:6px;padding:0 18px;background:#222;color:#fff;font:inherit;font-weight:650;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #777;outline-offset:2px}#resultados{margin-top:28px}.status{margin:0 0 12px;color:#666;font-size:.95rem}.livro{padding:16px 0;border-top:1px solid #ddd}.livro h2{margin:0 0 4px;font-size:1.05rem;line-height:1.3}.livro h2 a{color:inherit;text-decoration:none}.livro h2 a:hover,.livro h2 a:focus{text-decoration:underline}.livro p{margin:3px 0}.autor{font-weight:600}.preco{font-weight:700}.foto{display:inline-block;margin-top:8px;font-size:.92rem;color:inherit}.vazio{padding:20px 0;color:#666}footer{width:min(100% - 32px,760px);margin:auto auto 0;padding:20px 0 28px;border-top:1px solid #ddd;text-align:center;color:#666;font-size:.9rem}footer a{color:inherit}@media(max-width:520px){main{padding-top:32px}form{grid-template-columns:1fr}button{width:100%}}@media(prefers-color-scheme:dark){body,input{background:#111;color:#eee}input{border-color:#666}button{background:#eee;color:#111;border-color:#eee}.status,.vazio,footer{color:#aaa}.livro,footer{border-color:#333}}
</style>
</head>
<body>
<main>
<h1>Sebo Menos Telas</h1>
<form id="busca" role="search">

<footer>Desde 2017 · São Paulo, SP · <a href="https://wa.me/5511981350566" target="_blank" rel="noopener noreferrer nofollow">Contato</a> · <a id="doacao" href="https://wa.me/5511981350566" target="_blank" rel="noopener noreferrer nofollow">Doação</a></footer>
<script>
(()=>{const PHONE="5511981350566",form=document.getElementById("busca"),input=document.getElementById("q"),results=document.getElementById("resultados");const norm=v=>String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase("pt-BR");const money=v=>{const n=Number(v);return Number.isFinite(n)?n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}):String(v??"")};const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const wa=b=>`https://wa.me/${PHONE}?text=${encodeURIComponent(`Olá! Gostaria de receber fotos detalhadas deste exemplar:\n\n${b.titulo}, ${b.autor} — ${money(b.preco)}`)}`;document.getElementById("doacao").href=`https://wa.me/${PHONE}?text=${encodeURIComponent("Olá! Quero doar livros para o Sebo Menos Telas. Gostaria de saber como funciona.")}`;let catalogo=null;async function buscar(query){results.innerHTML='<p class="status">Buscando...</p>';try{if(!catalogo){const r=await fetch("/dados/catalogo.json",{cache:"no-cache"});if(!r.ok)throw Error();catalogo=await r.json()}const q=norm(query),lista=catalogo.filter(b=>norm([b.titulo,b.autor,b.editora,b.isbn].join(" ")).includes(q));if(!lista.length){results.innerHTML='<p class="vazio">Nenhum livro encontrado.</p>';return}results.innerHTML=`<p class="status">${lista.length} livro${lista.length===1?"":"s"} encontrado${lista.length===1?"":"s"} para “${esc(query)}”.</p>`+lista.map(b=>`<article class="livro"><h2><a href="/livro/${esc(b.slug)}.html">${esc(b.titulo)}</a></h2><p class="autor">${esc(b.autor)}</p><p>${esc(b.editora)} · ${esc(b.ano)}</p><p class="preco">${esc(money(b.preco))}</p><a class="foto" href="${esc(wa(b))}" target="_blank" rel="noopener noreferrer nofollow">Pedir fotos detalhadas pelo WhatsApp</a></article>`).join("")}catch(e){results.innerHTML='<p class="vazio">Não foi possível carregar o catálogo. Tente novamente.</p>'}}form.addEventListener("submit",e=>{e.preventDefault();const q=input.value.trim();if(!q){results.innerHTML="";input.focus();return}history.replaceState(null,"",`?q=${encodeURIComponent(q)}`);buscar(q)});const initial=new URLSearchParams(location.search).get("q");if(initial){input.value=initial;buscar(initial)}})();
</script>
